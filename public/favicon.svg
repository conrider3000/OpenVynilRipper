<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="vinylGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
  </defs>
  <!-- Outer vinyl disc -->
  <circle cx="32" cy="32" r="30" fill="url(#vinylGrad)" stroke="#ff7300" stroke-width="2"/>
  <!-- Grooves -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#2c2c2c" stroke-width="1"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#242424" stroke-width="1"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#2c2c2c" stroke-width="1"/>
  <!-- Subtle light reflection arc -->
  <path d="M 14 18 A 22 22 0 0 1 28 11" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 46 A 22 22 0 0 1 36 53" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round"/>
  <!-- Orange center label -->
  <circle cx="32" cy="32" r="11.5" fill="#ff7300"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#121212" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Center spindle hole -->
  <circle cx="32" cy="32" r="3.2" fill="#121212"/>
</svg>
